<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTTO • Neural Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 0%, #0c192c 0%, #030712 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }
    .card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 28px;
      padding: 40px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.15);
      backdrop-filter: blur(20px);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }
    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(2, 132, 199, 0.45);
      filter: brightness(1.1);
    }
    .counter-display {
      margin-top: 24px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      font-family: monospace;
      font-size: 13px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="pulse"></span>
      Sistema Operacional OTTO
    </div>
    <h1>Interface HTML5 Interativa</h1>
    <p>Este arquivo index.html foi renderizado no preview interativo com suporte completo a CSS, animações e interações em JavaScript.</p>
    
    <div class="actions">
      <button onclick="handleClick()">Testar Interatividade</button>
      <button style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);" onclick="handleReset()">Resetar</button>
    </div>

    <div class="counter-display" id="counter">Cliques registrados: 0</div>
  </div>

  <script>
    let clicks = 0;
    function handleClick() {
      clicks++;
      document.getElementById('counter').innerText = 'Cliques registrados: ' + clicks + ' (JavaScript Ativo!)';
      document.getElementById('counter').style.color = '#4ade80';
    }
    function handleReset() {
      clicks = 0;
      document.getElementById('counter').innerText = 'Cliques registrados: 0';
      document.getElementById('counter').style.color = '#38bdf8';
    }
  </script>
</body>
</html>
